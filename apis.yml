aid: bowery-capital
name: Bowery Capital
description: >-
  Bowery Capital is a B2B-focused venture capital firm that leads Pre-Seed and
  Seed rounds in founders "modernizing business through technology." It
  concentrates on SaaS and marketplace companies, with particular interest in
  vertical AI and back-office software, and takes lead-investor positions that
  it supports hands-on through four pillars: Growth (go-to-market and sales
  enablement), Talent (hiring, culture, and benefits), Business Development
  (pipeline and customer introductions), and a Revenue Council advisory network
  of operators. Surfaced in the API Evangelist network as a portfolio company of
  Foundry Group. Bowery Capital is an investor rather than an API provider and
  publishes no developer API surface.
